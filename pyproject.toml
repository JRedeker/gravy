[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gravy"
version = "0.1.0"
description = "Local-first, durable human review kit for coding agents"
requires-python = ">=3.11"
dependencies = [
    "gradio>=6.0.1,<7.0.0",
    "mcp>=1.12.0,<2.0.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
test = ["pytest>=9.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
