[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gravy"
version = "0.1.0"
description = "Local-first, durable human review kit for coding agents"
requires-python = ">=3.11"

[dependency-groups]
test = ["pytest>=9.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
